{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Pièces jointes</h1>
  {% if message %}<p class="ok">{{ message }}</p>{% endif %}
  <form method="post" enctype="multipart/form-data">
    <label>Fichier <input type="file" name="file" required></label>
    <button>Envoyer</button>
  </form>
</div>
<div class="card">
  <h2>Fichiers disponibles</h2>
  {% for f in files %}
  <p><a href="/uploads/{{ f }}">{{ f }}</a> – <a href="/download?file={{ f }}">télécharger</a></p>
  {% else %}
  <p>Aucun fichier.</p>
  {% endfor %}
</div>
{% endblock %}
